name: CI — P0 Foundation

on:
  push:
    branches: [case/p0-foundation]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 20

jobs:
  typecheck-test-build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify build output
        run: |
          test -d dist
          test -f dist/index.html

  playwright-smoke:
    needs: typecheck-test-build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for preview
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npx playwright test --project=chromium

  docker-qa-build:
    needs: typecheck-test-build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify QA Dockerfile exists and is valid
        run: |
          test -f Dockerfile.qa
          test -f qa/run-qaa.js
          docker build --check -f Dockerfile.qa . 2>&1 || \
            docker build -f Dockerfile.qa -t hermes-courier-gpu-qa . 2>&1 | head -20
